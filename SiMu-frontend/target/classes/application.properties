spring.application.name=SiMu client
server.port=${SERVER_PORT:8090}

# The backend gateway (auth-service, user-service, music-service, playlist-service behind it).
backend.base-url=${BACKEND_URL:http://localhost:8081}
backend.connect-timeout-ms=${BACKEND_CONNECT_TIMEOUT_MS:5000}
backend.read-timeout-ms=${BACKEND_READ_TIMEOUT_MS:20000}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.servlet.session.tracking-modes=cookie
spring.thymeleaf.cache=false
server.error.include-message=always