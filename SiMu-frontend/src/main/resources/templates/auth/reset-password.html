<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новый пароль')}"></head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 p-4">
<div class="w-full max-w-md rounded-2xl border border-white/10 bg-panel p-8 shadow-2xl">
    <h1 class="mb-2 text-xl font-semibold">Новый пароль</h1>
    <p class="mb-6 text-sm text-muted">После смены пароля все сессии будут завершены.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/reset-password}" method="post" class="space-y-4">
        <input type="hidden" name="token" th:value="${token}">
        <div>
            <label for="newPassword" class="mb-1 block text-sm text-muted">Пароль</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required
                   minlength="6" maxlength="100" pattern="(?=.*[A-Z])(?=.*\d).{6,100}"
                   title="Минимум 6 символов, одна заглавная буква и одна цифра"
                   class="w-full rounded-xl border border-line bg-ink px-4 py-2.5 text-sm outline-none transition focus:border-indigo-500">
            <p class="mt-1 text-xs text-muted">6+ символов, заглавная буква и цифра</p>
        </div>
        <button type="submit"
                class="w-full rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 px-4 py-3 text-sm font-medium transition hover:opacity-90">
            Сохранить пароль
        </button>
    </form>
</div>
</body>
</html>
