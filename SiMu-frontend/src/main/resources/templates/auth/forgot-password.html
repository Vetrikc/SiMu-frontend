<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Восстановление пароля')}"></head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 p-4">
<div class="w-full max-w-md rounded-2xl border border-white/10 bg-panel p-8 shadow-2xl">
    <h1 class="mb-2 text-xl font-semibold">Восстановление пароля</h1>
    <p class="mb-6 text-sm text-muted">
        Укажите e-mail аккаунта — мы отправим ссылку для смены пароля. Ссылка живёт 30 минут.
    </p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/forgot-password}" method="post" class="space-y-4">
        <div>
            <label for="email" class="mb-1 block text-sm text-muted">E-mail</label>
            <input id="email" name="email" type="email" required
                   class="w-full rounded-xl border border-line bg-ink px-4 py-2.5 text-sm outline-none transition focus:border-indigo-500">
        </div>
        <button type="submit"
                class="w-full rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 px-4 py-3 text-sm font-medium transition hover:opacity-90">
            Отправить ссылку
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-muted">
        <a th:href="@{/signin}" class="text-indigo-400 hover:text-indigo-300">Вернуться ко входу</a>
    </p>
</div>
</body>
</html>
