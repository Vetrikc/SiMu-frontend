<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body class="flex min-h-screen items-center justify-center bg-ink p-4">
<div class="w-full max-w-md rounded-2xl border border-line bg-panel p-8 text-center">
    <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-rose-500/15 text-2xl text-rose-300">!</div>
    <h1 class="text-xl font-semibold">Не получилось</h1>
    <p class="mt-2 text-sm text-muted" th:text="${error}">Ошибка</p>
    <p class="mt-1 text-xs text-muted">Код ответа: <span th:text="${status}">500</span></p>
    <div class="mt-6 flex justify-center gap-3">
        <a th:href="@{/home}" class="rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 px-4 py-2.5 text-sm font-medium transition hover:opacity-90">
            В библиотеку
        </a>
        <a th:href="@{/}" class="rounded-xl border border-line px-4 py-2.5 text-sm transition hover:bg-white/5">
            На главную
        </a>
    </div>
</div>
</body>
</html>
