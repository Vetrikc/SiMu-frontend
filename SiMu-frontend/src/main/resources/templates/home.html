<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Библиотека')}"></head>
<body class="bg-ink text-gray-100">
<div class="flex min-h-screen">
    <aside th:replace="~{fragments/layout :: sidebar('home')}"></aside>

    <div class="flex min-w-0 flex-1 flex-col">
        <nav th:replace="~{fragments/layout :: mobileNav}"></nav>

        <main class="flex-1 px-4 py-6 pb-32 md:px-10 md:py-8">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-semibold md:text-3xl">Библиотека</h1>
                    <p class="mt-1 text-sm text-muted">
                        <span th:text="${#lists.size(tracks)}">0</span> треков ·
                        <span th:text="${#lists.size(playlists)}">0</span> плейлистов
                    </p>
                </div>
                <a th:href="@{/upload}"
                   class="rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 px-4 py-2.5 text-sm font-medium transition hover:opacity-90">
                    Загрузить трек
                </a>
            </div>

            <input id="search" type="search" placeholder="Поиск по названию или исполнителю"
                   class="mb-6 w-full max-w-md rounded-xl border border-line bg-panel px-4 py-2.5 text-sm outline-none transition placeholder:text-muted focus:border-indigo-500">

            <div th:if="${#lists.isEmpty(tracks)}"
                 class="rounded-2xl border border-dashed border-line bg-panel/60 p-10 text-center">
                <p class="text-lg font-medium">Пока пусто</p>
                <p class="mt-1 text-sm text-muted">Загрузите первый трек — он появится здесь и будет доступен в плейлистах.</p>
                <a th:href="@{/upload}" class="mt-4 inline-block rounded-xl border border-line px-4 py-2 text-sm transition hover:bg-white/5">
                    Загрузить трек
                </a>
            </div>

            <div id="track-grid" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                <article th:each="track : ${tracks}" data-track
                         th:attr="data-search=${track.name} + ' ' + ${track.artist}"
                         class="rounded-2xl border border-line bg-panel p-4 transition hover:border-indigo-500/40">
                    <div class="flex items-start gap-3">
                        <div class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-indigo-500/30 to-pink-500/30 text-lg">♪</div>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" th:text="${track.name}">track</p>
                            <p class="truncate text-sm text-muted" th:text="${track.artist}">artist</p>
                        </div>
                        <button type="button"
                                class="play-btn grid h-10 w-10 shrink-0 place-items-center rounded-full bg-gradient-to-br from-indigo-500 to-pink-500 text-sm transition hover:opacity-90"
                                th:attr="data-src=${track.url},data-title=${track.name},data-artist=${track.artist}"
                                title="Слушать">▶</button>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs text-muted">
                        <a th:href="@{/music/{id}(id=${track.id})}" class="transition hover:text-white">Подробнее</a>
                        <form th:action="@{/music/{id}/delete(id=${track.id})}" method="post"
                              data-confirm="Удалить трек из библиотеки?">
                            <button type="submit" class="transition hover:text-rose-300">Удалить</button>
                        </form>
                    </div>
                </article>
            </div>

            <p id="no-results" class="hidden rounded-2xl border border-line bg-panel p-6 text-center text-sm text-muted">
                Ничего не нашлось — попробуйте другой запрос.
            </p>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: player}"></div>
</body>
</html>
